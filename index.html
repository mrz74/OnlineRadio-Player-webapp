<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8791a" />
<title>Magyar Online Rádió Player</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">Magyar Online Rádió Player</header>

    <div class="display-bezel">
      <section class="display">
        <div class="name" id="stationName">Nincs kiválasztott csatorna</div>
        <div class="status" id="statusText">Válassz egy csatornát</div>
        <div class="meta-row">
          <span class="live-indicator" id="liveIndicator">● ÉLŐ ADÁS</span>
          <div class="vu-meter" id="vuMeter"></div>
        </div>
      </section>
    </div>

    <section class="controls">
      <div class="controls-bezel">
        <button id="playBtn" class="btn btn-round" title="Lejátszás / szünet" aria-label="Lejátszás / szünet">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="stopBtn" class="btn btn-round" title="Leállítás" aria-label="Leállítás">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
      </div>
      <div class="volume-wrap">
        <input type="range" id="volumeSlider" min="0" max="100" value="80" />
        <div class="volume-pct" id="volumePct">80%</div>
      </div>
    </section>

    <section class="toolbar">
      <input type="text" id="searchInput" placeholder="Keresés a csatornák között..." />
      <button id="addBtn" class="btn" title="Csatorna hozzáadása">+</button>
      <button id="reloadBtn" class="btn" title="Frissítés a stations.csv-ből">⟳</button>
      <button id="favFilterBtn" class="btn" title="Csak kedvencek">★</button>
      <button id="dataBtn" class="btn" title="Állomáslista frissítése, adatok mentése/visszatöltése">💾</button>
    </section>
    <input type="file" id="importFileInput" accept="application/json" style="display:none" />

    <section class="list-wrap">
      <table class="station-table">
        <thead>
          <tr>
            <th class="col-fav"></th>
            <th class="col-name" data-sort="name">Csatorna <span class="arrow" data-col="name"></span></th>
            <th class="col-genre" data-sort="genre">Műfaj <span class="arrow" data-col="genre"></span></th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="stationList"></tbody>
      </table>
    </section>
  </div>

  <!-- Csatorna hozzáadás / szerkesztés dialógus -->
  <div id="dialogOverlay" class="overlay hidden">
    <div class="dialog">
      <h3 id="dialogTitle">Csatorna hozzáadása</h3>
      <label>Csatorna neve *</label>
      <input type="text" id="dlgName" />
      <label>Stream URL (http:// vagy https://) *</label>
      <input type="text" id="dlgUrl" />
      <label>Műfaj / kategória (opcionális)</label>
      <input type="text" id="dlgGenre" />
      <div class="dialog-error" id="dlgError"></div>
      <div class="dialog-buttons">
        <button id="dlgSave" class="btn">Mentés</button>
        <button id="dlgCancel" class="btn">Mégse</button>
      </div>
    </div>
  </div>

  <audio id="audioEl" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
